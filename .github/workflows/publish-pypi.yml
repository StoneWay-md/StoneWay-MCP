name: Publish to PyPI and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Release tag: $TAG, pyproject.toml version: $PY_VER"
          if [ "$TAG" != "$PY_VER" ]; then
            echo "ERROR: Release tag v$TAG does not match pyproject.toml version $PY_VER"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest pytest-asyncio build

      - name: Run Python unit tests
        run: |
          pytest tests/ -v

  build-and-publish:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Mandatory for Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify build outputs
        run: |
          ls -la dist/
          tar tzf dist/*.tar.gz | head -30

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  registry:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync server.json version with release tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -z "$V" ]; then
            V=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
          fi
          jq --arg v "$V" '.version=$v | .packages[].version=$v' server.json > s.json
          mv s.json server.json

      - name: Install mcp-publisher
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher-linux-amd64 -o mcp-publisher
          chmod +x mcp-publisher

      - name: Wait for PyPI to serve the new version
        run: sleep 90

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
        continue-on-error: true
